target-version = "py311"
line-length = 100
include = [
    "lead_factory/**/*.py",
    "scripts/**/*.py",
    "taskbot/**/*.py",
    "tests/**/*.py",
    "scheduled_runner.py",
]
extend-exclude = [
    ".git",
    ".gitnexus",
    ".venv",
    "_diagnostics",
    "logs",
    "mailbox",
    "outputs",
    "pool",
    "reports",
    "state",
    "task_backups",
    "tmp",
]

[lint]
# Keep the recovery gate explicit and stable across Ruff releases.
select = ["E4", "E7", "E9", "F"]
